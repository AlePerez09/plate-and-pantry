<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate and Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header, filter bar, responsive card grid; recipe view is a two-column ingredients/method spread. */
:root {
  --bg: #f3f5f0;
  --surface: #ffffff;
  --ink: #17261f;
  --muted: #5b6a62;
  --line: #d9dfd6;
  --accent: #f0b429;
  --accent-ink: #2a1f00;
  --deep: #1f4d3a;
  --tile-l: 80%;
  --tile-ink: #17261f;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713; --surface: #18221c; --ink: #e9efe9; --muted: #98a89e; --line: #2b382f;
    --accent: #f0b429; --accent-ink: #2a1f00; --deep: #7fd1a8; --tile-l: 26%; --tile-ink: #eef3ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --surface: #18221c; --ink: #e9efe9; --muted: #98a89e; --line: #2b382f;
  --accent: #f0b429; --accent-ink: #2a1f00; --deep: #7fd1a8; --tile-l: 26%; --tile-ink: #eef3ee;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.5; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }

header.top { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
header.top .wrap { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.02em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
.top .tag { color: var(--muted); font-size: 0.9rem; }

.hero { padding: 36px 0 12px; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 10px; text-wrap: balance; max-width: 16ch; }
.hero p { margin: 0; color: var(--muted); max-width: 50ch; }

.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 20px 0 8px; }
.search { flex: 1 1 220px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
.chip[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 12px 0 56px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none; display: flex; flex-direction: column; transition: transform .15s ease, border-color .15s ease; }
.card:hover { transform: translateY(-3px); border-color: var(--deep); }
.tile { background: hsl(var(--h) 55% var(--tile-l)); color: var(--tile-ink); padding: 16px; height: 120px; display: flex; flex-direction: column; justify-content: space-between; }
.tile .cat { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.tile .mins { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.tile .mins small { font-size: 1rem; font-weight: 600; margin-left: 4px; letter-spacing: 0; }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { margin: 0; font-family: var(--display); font-size: 1.25rem; line-height: 1.15; letter-spacing: -0.01em; }
.card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.card p.mline { font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 600; color: var(--deep); }
.empty { color: var(--muted); padding: 24px 0 56px; }

.back { display: inline-flex; gap: 8px; align-items: center; margin: 22px 0 6px; font-weight: 600; text-decoration: none; color: var(--deep); }
.back:hover { text-decoration: underline; }
.rhead { background: hsl(var(--h) 55% var(--tile-l)); color: var(--tile-ink); border-radius: 16px; padding: 24px; margin: 8px 0 24px; }
.rhead .cat { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.rhead h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 6vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; margin: 6px 0 8px; text-wrap: balance; }
.rhead p { margin: 0 0 16px; max-width: 54ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.facts div { font-size: 0.9rem; }
.facts b { display: block; font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.macros { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; margin-top: 18px; max-width: 560px; }
.macros div { background: color-mix(in srgb, var(--surface) 55%, transparent); border-radius: 10px; padding: 8px 10px; font-size: 0.8rem; font-weight: 600; }
.macros b { display: block; font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.rhead p.note { margin: 8px 0 0; font-size: 0.8rem; opacity: 0.8; }

.spread { display: grid; grid-template-columns: 1fr; gap: 32px; padding-bottom: 64px; }
@media (min-width: 800px) { .spread { grid-template-columns: 360px 1fr; } }
.spread h2 { font-family: var(--display); font-size: 1.4rem; margin: 0 0 12px; letter-spacing: -0.01em; }
.servings { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.servings button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.2rem; line-height: 1; }
.servings button:hover { border-color: var(--deep); }
.servings output { min-width: 5.5em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
ul.ing { list-style: none; margin: 0 0 14px; padding: 0; border-top: 1px solid var(--line); }
ul.ing li { border-bottom: 1px solid var(--line); }
ul.ing li.grp { border-bottom: 0; padding: 16px 2px 6px; font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--deep); }
ul.ing label { display: flex; gap: 12px; padding: 10px 2px; cursor: pointer; align-items: baseline; }
ul.ing input { accent-color: var(--deep); width: 18px; height: 18px; flex: none; transform: translateY(3px); }
ul.ing .q { font-weight: 700; min-width: 5em; font-variant-numeric: tabular-nums; }
ul.ing input:checked ~ span { color: var(--muted); text-decoration: line-through; }
.fixednote { color: var(--muted); font-size: 0.85rem; margin: 0 0 14px; }
.copy { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
.copy:hover { filter: brightness(0.95); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 18px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; }
ol.steps li::before { content: counter(s); width: 36px; height: 36px; border-radius: 50%; background: var(--deep); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
ol.steps p { margin: 0; max-width: 62ch; }
.tip { margin-top: 28px; border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); max-width: 62ch; }

[hidden] { display: none !important; }
.themewrap { position: static; }
.themebtn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
.themebtn:hover { border-color: var(--deep); }
.themebtn .dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--deep) 50%, var(--accent) 50%); display: inline-block; }
.themepanel { position: absolute; right: 16px; top: calc(100% + 8px); z-index: 10; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.themepanel h2 { font-family: var(--display); font-size: 1rem; margin: 0 0 4px; }
.themepanel p { margin: 0 0 12px; color: var(--muted); font-size: 0.85rem; }
.swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sw { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-weight: 600; text-align: left; }
.sw i { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.sw[aria-pressed="true"] { border-color: var(--deep); box-shadow: inset 0 0 0 1px var(--deep); }
.morebtn { background: none; border: 0; padding: 8px 0 0; color: var(--deep); font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
#moreswatches { margin-top: 8px; }
.customrow label { font-size: 0.9rem; }
.customrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-weight: 600; }
.customrow input[type="color"] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; }
.btn { background: color-mix(in srgb, var(--surface) 70%, transparent); color: inherit; border: 1px solid currentColor; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
.btn:hover { background: var(--surface); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.printfoot { display: none; }
@media (max-width: 640px) { .top .tag { display: none; } }

/* Food-color themes: --H hue, --S saturation, --A accent, --AI text on accent (set from script) */
:root[data-food] { --bg: hsl(var(--H) calc(22% * var(--T, 1)) 95%); --surface: #ffffff; --ink: hsl(var(--H) calc(35% * var(--T, 1)) 11%); --muted: hsl(var(--H) calc(12% * var(--T, 1)) 36%); --line: hsl(var(--H) calc(18% * var(--T, 1)) 85%); --deep: hsl(var(--H) var(--S) 25%); --accent: var(--A); --accent-ink: var(--AI); }
@media (prefers-color-scheme: dark) {
  :root[data-food]:not([data-theme="light"]) { --bg: hsl(var(--H) calc(24% * var(--T, 1)) 8%); --surface: hsl(var(--H) calc(20% * var(--T, 1)) 12%); --ink: hsl(var(--H) calc(25% * var(--T, 1)) 92%); --muted: hsl(var(--H) calc(12% * var(--T, 1)) 66%); --line: hsl(var(--H) calc(16% * var(--T, 1)) 21%); --deep: hsl(var(--H) calc(55% * var(--T, 1)) 68%); }
}
:root[data-food][data-theme="dark"] { --bg: hsl(var(--H) calc(24% * var(--T, 1)) 8%); --surface: hsl(var(--H) calc(20% * var(--T, 1)) 12%); --ink: hsl(var(--H) calc(25% * var(--T, 1)) 92%); --muted: hsl(var(--H) calc(12% * var(--T, 1)) 66%); --line: hsl(var(--H) calc(16% * var(--T, 1)) 21%); --deep: hsl(var(--H) calc(55% * var(--T, 1)) 68%); }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hright { display: flex; align-items: center; gap: 14px; }
.navlink { font-weight: 700; text-decoration: none; color: var(--deep); }
.navlink:hover { text-decoration: underline; }
.btn.solid { background: var(--deep); color: var(--bg); border-color: var(--deep); text-decoration: none; display: inline-block; }
.btn.solid:hover { filter: brightness(1.08); background: var(--deep); }
a.btn { text-decoration: none; display: inline-block; }
.herocta { margin-top: 16px !important; }
.hero.slim { padding-bottom: 4px; }
h2.sect { font-family: var(--display); font-size: 1.35rem; letter-spacing: -0.01em; margin: 18px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.err { color: #c2410c; font-weight: 600; margin: 8px 0 0; min-height: 0; }
.err:empty { display: none; }

.nutsec { padding-bottom: 56px; max-width: 680px; }
.nutsec h2 { font-family: var(--display); font-size: 1.4rem; margin: 0 0 4px; }
table.nut { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
table.nut th, table.nut td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); font-weight: 400; }
table.nut thead th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
table.nut tbody th { font-weight: 600; }
table.nut .num { text-align: right; white-space: nowrap; }
table.nut .dv { width: 9.5em; }
.bar { display: inline-block; width: 4.5em; height: 6px; border-radius: 3px; background: var(--line); margin-right: 8px; vertical-align: middle; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--deep); }

.builder { display: grid; grid-template-columns: 1fr; gap: 28px; padding: 12px 0 64px; }
@media (min-width: 900px) { .builder { grid-template-columns: 1fr 340px; } .bside { position: sticky; top: 80px; align-self: start; } }
.bmain { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.bmain h2, .bside h2 { font-family: var(--display); font-size: 1.35rem; margin: 14px 0 0; }
.bside { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.bside h2 { margin-top: 0; }
.bside h3 { font-family: var(--display); font-size: 1.05rem; margin: 18px 0 0; }
.fieldrow { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.grow { flex: 1 1 220px; }
.field.small input { width: 6em; }
.field label { font-weight: 600; font-size: 0.9rem; }
.field input, .field select, .field textarea, .searchrow input { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.field textarea { resize: vertical; font: inherit; }
.searchrow { display: flex; gap: 8px; }
.searchrow input { flex: 1; }
h3.rhd { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 8px 0 6px; }
ul.results { list-style: none; margin: 0 0 8px; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; max-height: 340px; overflow-y: auto; }
ul.results li + li { border-top: 1px solid var(--line); }
ul.results button { width: 100%; text-align: left; background: var(--surface); border: 0; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
ul.results button:hover { background: color-mix(in srgb, var(--deep) 8%, var(--surface)); }
.rn { font-weight: 600; }
.rm { color: var(--muted); font-size: 0.85rem; }
details.label { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
details.label summary { cursor: pointer; font-weight: 600; color: var(--deep); }
.labelgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 12px 0 6px; }
.labelgrid .span2 { grid-column: 1 / -1; }
ul.blist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.blist li { display: grid; grid-template-columns: 1fr 5.5em auto 4.5em 32px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.bname { display: flex; flex-direction: column; min-width: 0; }
.bname span:first-child { font-weight: 600; overflow-wrap: anywhere; }
.src { color: var(--muted); font-size: 0.8rem; }
.grams { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; }
.gunit { color: var(--muted); }
.kc { text-align: right; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.x { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 1.1rem; line-height: 1; }
.x:hover { border-color: #c2410c; color: #c2410c; }
.emptyin { margin: 0; }
.macros.side { max-width: none; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
.macros.side div { background: color-mix(in srgb, var(--deep) 8%, var(--surface)); }
@media (max-width: 520px) { ul.blist li { grid-template-columns: 1fr 5em auto 32px; } .kc { display: none; } .hright .navlink { font-size: 0.9rem; } }
.bside .bar { display: none; }
.bside table.nut .dv { width: auto; }
.bside table.nut th, .bside table.nut td { padding: 6px 2px; font-size: 0.9rem; }
#b-status:empty, #b-results:empty { display: none; }
.brand { white-space: nowrap; }
@media (max-width: 520px) { .hright .navlink { display: none; } }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; vertical-align: 1px; }
.tag.full { background: color-mix(in srgb, var(--deep) 16%, transparent); color: var(--deep); }
.tag.lbl { background: color-mix(in srgb, var(--accent) 26%, transparent); color: var(--ink); }
.atl { font-size: 0.75rem; color: var(--muted); }
tr.part td, tr.part th { color: var(--muted); }
details.srcs { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
details.srcs summary { cursor: pointer; font-weight: 600; color: var(--deep); }
details.srcs ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }

/* Side doodles: decorative; sized and placed inside the side space so they never cover content */
.doodles { display: none; }
@media (min-width: 1480px) {
  .doodles { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 0; --gutter: calc((100vw - 1320px) / 2); }
  .dd { position: absolute; opacity: .9; width: min(var(--w), calc(var(--gutter) * .62)); transform: rotate(var(--rot)); animation: bob 7s ease-in-out var(--d) infinite; }
  .dd.l { left: calc(var(--gutter) * var(--x)); translate: -50% 0; }
  .dd.r { right: calc(var(--gutter) * var(--x)); translate: 50% 0; }
  .dd svg { display: block; width: 100%; height: auto; }
  main.wrap, header.top, footer { position: relative; z-index: 1; }
  header.top { z-index: 5; }
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(var(--rot)); } 50% { transform: translateY(-10px) rotate(calc(var(--rot) + 4deg)); } }
@media (prefers-reduced-motion: reduce) { .dd { animation: none; } }
@media print { .doodles { display: none !important; } }

/* ---- Accessibility options ---- */
.skip { position: absolute; left: -9999px; top: 8px; z-index: 30; background: var(--deep); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; }
.skip:focus { left: 16px; }
#app:focus { outline: none; }
.iconbtn { width: 38px; height: 38px; padding: 0; justify-content: center; }
.gear { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .4s ease; }
.themebtn:hover .gear, .themebtn[aria-expanded="true"] .gear { transform: rotate(60deg); }
:root[data-motion="reduce"] .gear { transition: none; }
@media (prefers-reduced-motion: reduce) { .gear { transition: none; } }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 12px; }
.seg button { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; cursor: pointer; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--bg); }
.tog { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; cursor: pointer; text-align: left; }
.tog span { display: flex; flex-direction: column; font-weight: 600; }
.tog small { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
.tog i { flex: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.tog[aria-checked="true"] i { background: var(--deep); }
.tog[aria-checked="true"] i::after { left: 19px; }
.resetbtn { margin-top: 8px; background: none; border: 0; padding: 4px 0; color: var(--deep); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.panelsub { margin: 4px 0 0 !important; font-weight: 600; color: var(--ink) !important; font-size: 0.9rem !important; }
@media (max-width: 520px) { .a11ylabel { display: none; } }

/* Easy-read font */
:root[data-font="easy"] { --body: "Atkinson Hyperlegible", "Verdana", sans-serif; --display: "Atkinson Hyperlegible", "Verdana", sans-serif; }
:root[data-font="easy"] body { line-height: 1.65; letter-spacing: 0.01em; word-spacing: 0.06em; }
:root[data-font="easy"] h1, :root[data-font="easy"] h2, :root[data-font="easy"] h3, :root[data-font="easy"] .brand, :root[data-font="easy"] .tile .mins { letter-spacing: 0; }

/* Reduce motion / hide doodles */
:root[data-motion="reduce"] .dd { animation: none; }
:root[data-motion="reduce"] .card, :root[data-motion="reduce"] .tog i, :root[data-motion="reduce"] .tog i::after { transition: none; }
:root[data-motion="reduce"] .card:hover { transform: none; }
:root[data-doodles="off"] .doodles { display: none !important; }

/* High contrast (overrides any food theme) */
:root[data-contrast="high"] { --bg: #ffffff; --surface: #ffffff; --ink: #000000; --muted: #1f1f1f; --line: #000000; --deep: #004d29; --accent: #ffd000; --accent-ink: #000000; --tile-l: 90%; --tile-ink: #000000; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root[data-contrast="high"]:not([data-theme="light"]) { --bg: #000000; --surface: #000000; --ink: #ffffff; --muted: #e8e8e8; --line: #ffffff; --deep: #7dffb2; --accent: #ffd000; --accent-ink: #000000; --tile-l: 15%; --tile-ink: #ffffff; color-scheme: dark; }
}
:root[data-contrast="high"][data-theme="dark"] { --bg: #000000; --surface: #000000; --ink: #ffffff; --muted: #e8e8e8; --line: #ffffff; --deep: #7dffb2; --accent: #ffd000; --accent-ink: #000000; --tile-l: 15%; --tile-ink: #ffffff; color-scheme: dark; }
:root[data-contrast="high"] .card, :root[data-contrast="high"] .search, :root[data-contrast="high"] .chip, :root[data-contrast="high"] .themebtn, :root[data-contrast="high"] .bside { border-width: 2px; }
:root[data-contrast="high"] a:not(.card):not(.btn):not(.brand):not(.skip) { text-decoration: underline; text-underline-offset: 3px; }
:root[data-contrast="high"] .rhead .note, :root[data-contrast="high"] .rhead p.note { opacity: 1; }
:root[data-contrast="high"] :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* ---- Units and tags ---- */
.unitseg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0 0 14px; }
.unitseg button { background: transparent; border: 0; padding: 6px 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.unitseg button + button { border-left: 1px solid var(--line); }
.unitseg button[aria-pressed="true"] { background: var(--deep); color: var(--bg); }
.dtags { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 10px; }
.dtag { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 60%, transparent); }
.rhead p.contains { margin: 0 0 16px; font-size: 0.9rem; }
.cnote { opacity: 0.75; }
details.filters { margin: 4px 0 6px; }
details.filters summary { cursor: pointer; font-weight: 700; color: var(--deep); padding: 4px 0; width: max-content; }
details.filters .count { display: inline-block; min-width: 1.4em; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--deep); color: var(--bg); font-size: 0.8rem; text-align: center; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 10px 0 0; }
.flabel { font-weight: 600; font-size: 0.9rem; min-width: 9.5em; }
.chip.avoid[aria-pressed="true"] { background: #b42318; border-color: #b42318; color: #fff; }
details.filters p.muted { margin: 10px 0 0; }
.mfrow { align-items: flex-start; }
.mgrid { flex: 1 1 520px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 22px; }
.mf label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
.mf output { font-weight: 700; color: var(--deep); }
.mf input[type="range"] { width: 100%; accent-color: var(--deep); margin: 4px 0 0; }
.resbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 14px 0 -4px; }
.resbar p { margin: 0; font-size: 0.92rem; }
.sortlbl { font-size: 0.92rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.sortlbl select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; font-weight: 600; color: inherit; }
.picks { margin: 14px 0 6px; padding: 18px 18px 12px; border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--accent) 9%, var(--bg)); }
.picks.collapsed { padding: 0; border: 0; background: none; margin: 8px 0 0; }
.pickhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; }
.pickhead .sect { margin: 0; }
.pickhead p { margin: 4px 0 0; }
.pickctl { display: flex; gap: 16px; }
.pickctl .resetbtn { margin: 0; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick > .card { flex: 1; }
.pickbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding: 0 2px; }
.pickbar span { line-height: 1.35; }
.pickswap { flex: none; }
.nopick { border: 1px dashed var(--line); border-radius: 16px; padding: 18px; justify-content: center; }
.grid.picks3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); padding: 0; }
@media print { .picks { display: none !important; } }
@media print { .unitseg, details.filters, .resbar { display: none !important; } }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; padding: 20px 0 32px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

@media print {
  @page { margin: 14mm; }
  :root:root:root:root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #999; --deep: #000; --tile-l: 92%; --tile-ink: #000; color-scheme: light; }
  body { font-size: 11pt; line-height: 1.4; }
  header.top, footer, .back, .actions, .builder, .herocta, .bar, .servings button, .copy, .tools, .hero, .themepanel { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .rhead { background: none; border-bottom: 2px solid #000; border-radius: 0; padding: 0 0 10px; margin: 0 0 14px; }
  .rhead h1 { font-size: 22pt; }
  .macros div { background: none; border: 1px solid #999; }
  .spread { grid-template-columns: 1fr 1.6fr; gap: 24px; padding-bottom: 0; }
  ul.ing li, ol.steps li { break-inside: avoid; }
  ul.ing input { accent-color: #000; }
  ul.ing input:checked ~ span { text-decoration: none; color: #000; }
  ol.steps li::before { background: none; color: #000; border: 1px solid #000; }
  .tip { border-left-color: #000; color: #000; }
  .card { break-inside: avoid; }
  .printfoot { display: block; margin-top: 18px; font-size: 9pt; color: #555; }
}

<script>
/* Ingredient format: [amount, unit, name, fixed?]. amount can be a number, a [low, high] range, or text such as "to taste".
   {h: "Heading"} starts a group. fixed = true means the amount stays the same when servings change (a batch). */
var RECIPES = [
  { id: "avocado-toast", name: "Avocado Toast with 2 Eggs", cat: "Breakfast", h: 100, base: 1, prep: 5, cook: 5,
    blurb: "Mashed lemon avocado on toasted 647 bread, topped with two eggs.",
    macros: { kcal: 330, p: 18, fib: 14 },

    steps: ["Toast both slices of 647 bread until golden.","In a bowl, mash the avocado with lemon juice, salt, and pepper.","Spread the mashed avocado evenly over both slices.","Heat a nonstick pan over medium heat and add 1/2 teaspoon butter.","Crack in the eggs and season with salt, garlic powder, and chili flakes.","Cook eggs to your preference (fried or over-easy works best).","Place one egg on each slice of toast and finish with extra chili flakes if desired."] },

  { id: "banana-protein-oats", name: "Banana Protein Overnight Oats", cat: "Breakfast", h: 48, base: 1,
    blurb: "Protein yogurt, ripe banana and steel oats, chilled overnight.",
    macros: { kcal: 455, p: 37, c: 60, f: 7, fib: 15 },
    ing: [[140,"g","Ratio Vanilla Protein Yogurt"],[50,"mL","Fairlife fat-free milk"],[80,"g","banana, ripened, mashed"],[50,"g","steel oats"],[20,"g","allulose"],[10,"g","inulin fiber"],[4,"g","Naked Whey protein powder"]],
    steps: ["Add yogurt, Fairlife, ripe banana, allulose, inulin, and protein powder in a blender and puree until smooth.","Add the oats and shake until combined.","Cover and refrigerate overnight, or at least 4 to 6 hours."] },

  { id: "chocolate-overnight-oats", name: "Chocolate Overnight Oats", cat: "Breakfast", h: 22, base: 1,
    blurb: "Cocoa oats made with protein yogurt, chilled for at least 4 hours.",
    macros: { kcal: 400, p: 31, c: 51, f: 9, fib: 14, net: 37 },
    ing: [[100,"mL","1% Fairlife milk"],[50,"g","old-fashioned oats"],[140,"g","Ratio protein yogurt"],[20,"g","Hershey's Special Dark powder"],[15,"g","granulated sugar"],[10,"g","inulin fiber"],[40,"g","allulose sweetener"],[2,"g","vanilla extract"],[0.5,"g","salt"]],
    steps: ["Combine the Fairlife milk, oats, Ratio protein yogurt, Hershey's Special Dark cocoa powder, inulin fiber, allulose sweetener, granulated sugar, vanilla extract, and salt in a container.","Stir thoroughly until the cocoa powder and all other ingredients are evenly incorporated.","Cover and refrigerate for at least 4 hours, preferably overnight, until the oats have softened and the mixture has thickened.","Stir before serving. If the mixture is too thick, add a small amount of milk to reach the desired consistency."] },

  { id: "chicken-crunch-wrap", name: "Chicken Crunch Wrap", cat: "Lunch", h: 30, base: 1,
    blurb: "Grilled chicken and crunchy slaw in a Hero wrap, tossed in sweet sriracha honey.",
    macros: { kcal: 400, p: 52, fib: 37 },
    ing: [{h:"Assembly"},[1,"","Hero burrito wrap"],[4,"oz","grilled chicken"],
          {h:"Crunch slaw"},[2,"oz","shredded red cabbage"],[2,"oz","thinly sliced cucumber"],[2,"oz","thinly sliced red onion"],[1,"oz","sliced green onion"],[1,"oz","chopped cilantro"],[1,"","lime, juiced"],[3,"tbsp","plain low-fat Greek yogurt"],
          {h:"Sweet sriracha honey mix"},[1,"tbsp","sriracha"],[0.25,"cup","allulose"],[1,"tbsp","water"],[0.5,"tbsp","garlic powder"],[0.25,"tsp","honey"]],
    steps: ["In a medium bowl, combine the red cabbage, cucumber, red onion, green onion, cilantro, lime juice, and plain low-fat Greek yogurt.","In a small microwave-safe bowl, combine the sriracha, allulose, water, garlic powder, and honey. Microwave for 30 to 60 seconds, then stir until smooth.","Add the sweet sriracha honey mix to the slaw and toss until all ingredients are evenly coated.","Lay the Hero Wrap flat and add the 4 oz grilled chicken and creamy crunch slaw.","Fold and roll the wrap tightly and serve."] },

  { id: "chicken-salad-wrap", name: "Chicken Salad Wrap", cat: "Lunch", h: 78, base: 1,
    blurb: "Chopped roasted chicken in a light sour cream and lemon mix, rolled in a Hero tortilla.",

    ing: [[4,"oz","roasted chicken meat, chopped"],[55,"g","light sour cream"],[30,"g","red onion, diced"],[10,"g","green onion, sliced"],[5,"g","fresh parsley, chopped"],[15,"g","lemon juice"],[5,"g","garlic powder"],[1,"g","black pepper"],[1,"g","salt"],[1,"","burrito-size Hero tortilla"],[1,"oz","butter lettuce"]],
    steps: ["In a large bowl, combine the chicken, sour cream, red onion, green onion, parsley, lemon juice, garlic powder, black pepper, and salt.","Layer the butter lettuce onto the tortilla and spoon the chicken mixture over it.","Fold in the sides and roll tightly into a burrito."] },

  { id: "chicken-salad-wrap-apple", name: "Chicken Salad Wrap with Apple", cat: "Lunch", h: 130, base: 1,
    blurb: "The chicken salad wrap with chopped apple added for crunch.",
    macros: { kcal: 460, p: 45, c: 54, f: 13.5, fib: 29 },
    ing: [[4,"oz","roasted chicken meat, chopped"],[55,"g","light sour cream"],[30,"g","red onion, diced"],[10,"g","green onion, sliced"],[5,"g","fresh parsley, chopped"],[50,"g","apple"],[15,"g","lemon juice"],[5,"g","garlic powder"],[1,"g","black pepper"],[1,"g","salt"],[1,"","burrito-size Hero tortilla"],[1,"oz","butter lettuce"]],
    steps: ["In a large bowl, combine the chicken, sour cream, red onion, green onion, parsley, apple, lemon juice, garlic powder, black pepper, and salt.","Layer the butter lettuce onto the tortilla and spoon the chicken mixture over it.","Fold in the sides and roll tightly into a burrito."] },

  { id: "chili-crisp-tuna-wrap", name: "Chili Crisp Tuna Wrap", cat: "Lunch", h: 8, base: 1,
    blurb: "Tuna with sriracha, chili crisp and apple in a Hero tortilla, toasted in the air fryer.",

    ing: [[115,"g","tuna, canned or packaged"],[6,"g","sriracha"],[0.5,"tsp","chili crisp"],[1,"tsp","soy sauce"],[5,"g","ginger paste"],[30,"g","sour cream"],[10,"g","inulin"],[85,"g","apple, julienned"],[1,"","Hero burrito tortilla"]],

  { id: "blackened-white-fish", name: "Blackened White Fish with Baked Sweet Potato & Broccoli", cat: "Dinner", h: 205, base: 1,

          {h:"Seasoning"},[1,"tsp","paprika"],[0.5,"tsp","garlic powder"],[0.5,"tsp","onion powder"],[[0.25,0.5],"tsp","chili flakes"],[0.5,"tsp","dried thyme or oregano"],[0.5,"tsp","salt"],[0.25,"tsp","black pepper"]],
    steps: ["Preheat oven to 400°F. Pierce sweet potato with a fork and bake 45 to 60 minutes until soft.","Steam or microwave broccoli with a splash of water for 4 to 5 minutes. Season lightly if desired.","Pat fish dry and coat with seasoning.","Heat skillet over medium-high heat, add 1 tsp oil, and cook fish 3 to 4 minutes per side until flaky with a dark crust."] },

  { id: "chicken-fajita-rice-bowl", name: "Chicken Fajita Rice Bowl", cat: "Dinner", h: 355, base: 1,
    blurb: "Fajita-spiced chicken and peppers over brown rice with cilantro lime crema.",
    macros: { kcal: 545, p: 32, c: 56, f: 21 },
    ing: [{h:"Chicken and veggie sauté"},[113,"g","chicken breast, cut into strips (4 oz)"],[160,"g","bell peppers, sliced"],[100,"g","onion, sliced"],[25,"g","portobello mushrooms, sliced"],[1,"tbsp","canola oil"],
          [1,"tsp","chili powder"],[0.5,"tsp","paprika"],[0.5,"tsp","cumin"],[0.5,"tsp","garlic powder"],[0.25,"tsp","salt"],["dash","","cayenne"],[[1,2],"tbsp","water (for deglazing)"],
          {h:"Rice base"},[140,"g","steamed brown rice"],
          {h:"Cilantro lime crema batch (1 serving is 35 g)"},[150,"g","light sour cream",true],[20,"g","fresh lime juice",true],[10,"g","fresh cilantro, finely chopped",true],[15,"g","green onion, chopped",true]],
    steps: ["Prepare the crema. In a small bowl, whisk together 150 g light sour cream, 20 g lime juice, 10 g chopped cilantro, and 15 g green onion until smooth. Measure out 35 g (1 serving) for this bowl and refrigerate the remaining batch.","Sauté the chicken and veggies. Heat 1 tbsp canola oil in a large skillet over medium-high heat. Add 4 oz sliced chicken breast, 160 g bell peppers, 100 g onion, and 25 g portobello mushrooms. Sauté for 5 to 7 minutes until cooked through and tender.","Season and deglaze. Reduce heat to medium-low. Sprinkle over chili powder, paprika, cumin, garlic powder, salt, and cayenne. Add 1 to 2 tbsp water and stir immediately to deglaze the pan and coat everything in the sauce.","Assemble the bowl. Layer 140 g warm steamed brown rice at the base of your bowl. Pile the entire hot chicken and veggie mixture over the top, and spoon 35 g of the cilantro lime crema over the dish. Serve immediately."],
    tip: "Amounts in the method are for 1 serving. When you change servings, follow the ingredient list." }

  var lacking = {};

    rows.map(function (m) {
      var v = t.per[m[0]], dv = m[3] ? Math.round(v / m[3] * 100) : null, part = t.cover[m[0]] < t.count;

  { id: "spirulina", name: "Blue Spirulina", H: 190, S: 62, A: "#6fd8ea", AI: "#05262c", more: true },
  { id: "mango",     name: "Mango",     H: 30,  S: 80, A: "#ffb547", AI: "#3a2000", more: true },
  { id: "eggplant",  name: "Eggplant",  H: 285, S: 50, A: "#c79af0", AI: "#260a3a", more: true },
  { id: "chocolate", name: "Chocolate", H: 22,  S: 45, A: "#dba571", AI: "#2e1605", more: true },
  { id: "ube",       name: "Ube",       H: 268, S: 48, A: "#c7a6f7", AI: "#1d0b3a", more: true },
  { id: "turnip",    name: "Turnip",    H: 300, S: 32, A: "#e3b4ef", AI: "#2e0f36", T: 0.12, more: true }
];
var currentTheme = { id: "default" };
function themeById(id) { for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i]; return null; }
function hexToHs(hex) {
  var r = parseInt(hex.substr(1, 2), 16) / 255, g = parseInt(hex.substr(3, 2), 16) / 255, b = parseInt(hex.substr(5, 2), 16) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2, h = 0, sat = 0;
  if (d) {
    sat = d / (1 - Math.abs(2 * l - 1));
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
  }
  return { h: h, s: Math.round(sat * 100) };
}
function themeVars(t) {
  if (t.id === "custom") {
    var sat = t.s < 10 ? 8 : Math.max(35, Math.min(65, t.s));
    return { H: t.h, S: sat, A: "hsl(" + t.h + " 90% 62%)", AI: "hsl(" + t.h + " 50% 10%)" };
  }
  return themeById(t.id);
}
function setTheme(t, save) {
  var root = document.documentElement, st = root.style;
  ["--H", "--S", "--A", "--AI", "--T"].forEach(function (p) { st.removeProperty(p); });
  if (!t || t.id === "default" || (t.id !== "custom" && !themeById(t.id))) {
    t = { id: "default" }; root.removeAttribute("data-food");
  } else {
    var v = themeVars(t);
    root.setAttribute("data-food", t.id);
    st.setProperty("--H", v.H); st.setProperty("--S", v.S + "%"); st.setProperty("--A", v.A); st.setProperty("--AI", v.AI); if (v.T !== undefined) st.setProperty("--T", v.T);
  }
  currentTheme = t;
  if (save) { try { localStorage.setItem("pp-theme", JSON.stringify(t)); } catch (e) {} }
  Array.prototype.forEach.call(document.querySelectorAll(".sw"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-id") === t.id)); });
}
function buildThemePanel() {
  var panel = document.getElementById("themepanel"), btn = document.getElementById("themebtn");
  function sw(t) {
    var deep = "hsl(" + t.H + " " + t.S + "% 30%)";
    var bg = t.T !== undefined ? "linear-gradient(135deg,#f6f3f6 50%," + deep + " 50%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)" : "linear-gradient(135deg," + deep + " 50%," + t.A + " 50%)";
    return '<button class="sw" type="button" data-id="' + t.id + '" aria-pressed="false"><i style="background:' + bg + '"></i>' + t.name + '</button>';
  }
  var extra = THEMES.filter(function (t) { return t.more; });
  panel.innerHTML = '<h2>Eat the rainbow</h2><p>Sprinkle your favorite food\u2019s colors all over the site.</p>' +
    '<div class="swatches">' + THEMES.filter(function (t) { return !t.more; }).map(sw).join("") + '</div>' +
    '<button class="morebtn" type="button" id="morefoods" aria-expanded="false" aria-controls="moreswatches">More foods (' + extra.length + ')</button>' +
    '<div class="swatches" id="moreswatches" hidden>' + extra.map(sw).join("") + '</div>' +
    '<div class="customrow"><label for="custom">Not hungry for these? Pick any color.</label><input id="custom" type="color" value="#2f7d4f"></div>';
  var moreBtn = panel.querySelector("#morefoods"), moreBox = panel.querySelector("#moreswatches");
  moreBtn.addEventListener("click", function () {
    var open = moreBox.hidden; moreBox.hidden = !open;
    moreBtn.setAttribute("aria-expanded", String(open));
    moreBtn.textContent = open ? "Fewer foods" : "More foods (" + extra.length + ")";
  });
  Array.prototype.forEach.call(panel.querySelectorAll(".sw"), function (b) {
    b.addEventListener("click", function () { setTheme({ id: b.getAttribute("data-id") }, true); });
  });
  panel.querySelector("#custom").addEventListener("input", function (e) { var hs = hexToHs(e.target.value); setTheme({ id: "custom", h: hs.h, s: hs.s }, true); });
  function close() { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  btn.addEventListener("click", function (e) { e.stopPropagation(); var open = panel.hidden; panel.hidden = !open; btn.setAttribute("aria-expanded", String(open)); });
  panel.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !panel.hidden) { close(); btn.focus(); } });
}
buildThemePanel();

/* ---- Display and accessibility options ---- */
var A11Y_DEFAULT = { size: 0, contrast: false, font: false, motion: false, doodles: true };
var a11y = JSON.parse(JSON.stringify(A11Y_DEFAULT));
var SIZES = [100, 112.5, 125, 140];
function applyA11y() {
  var root = document.documentElement;
  root.style.fontSize = SIZES[a11y.size] + "%";
  if (a11y.contrast) root.setAttribute("data-contrast", "high"); else root.removeAttribute("data-contrast");
  if (a11y.font) root.setAttribute("data-font", "easy"); else root.removeAttribute("data-font");
  if (a11y.motion) root.setAttribute("data-motion", "reduce"); else root.removeAttribute("data-motion");
  if (!a11y.doodles) root.setAttribute("data-doodles", "off"); else root.removeAttribute("data-doodles");
}
function saveA11y() { try { localStorage.setItem("pp-a11y", JSON.stringify(a11y)); } catch (e) {} }
function buildA11yPanel() {
  var panel = document.getElementById("a11ypanel"), btn = document.getElementById("a11ybtn");
  var TOGS = [["contrast", "High contrast", "Stronger text and borders"], ["font", "Easy-read font", "Clearer letters, more spacing"],
              ["motion", "Reduce motion", "Stops animations"], ["doodles", "Show side doodles", "Food drawings on wide screens"]];
  function draw() {
    panel.innerHTML = '<h2>Settings</h2><p>Text size, contrast, font and motion. Saved on this device.</p>' +
      '<p class="panelsub" id="sizelabel">Text size</p><div class="seg" role="group" aria-labelledby="sizelabel">' +
      ["Default", "Large", "Larger", "Largest"].map(function (n, i) {
        return '<button type="button" data-size="' + i + '" aria-pressed="' + (a11y.size === i) + '" aria-label="' + n + ' text" style="font-size:' + (0.85 + i * 0.12) + 'rem">A</button>';
      }).join("") + '</div>' +
      TOGS.map(function (t) {
        return '<button type="button" class="tog" role="switch" data-key="' + t[0] + '" aria-checked="' + !!a11y[t[0]] + '"><span>' + t[1] + '<small>' + t[2] + '</small></span><i aria-hidden="true"></i></button>';
      }).join("") +
      '<button type="button" class="resetbtn" id="a11yreset">Reset to default</button>';
    Array.prototype.forEach.call(panel.querySelectorAll("[data-size]"), function (b) {
      b.addEventListener("click", function () { a11y.size = +b.getAttribute("data-size"); applyA11y(); saveA11y(); draw(); panel.querySelector('[data-size="' + a11y.size + '"]').focus(); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".tog"), function (b) {
      b.addEventListener("click", function () { var k = b.getAttribute("data-key"); a11y[k] = !a11y[k]; applyA11y(); saveA11y(); b.setAttribute("aria-checked", String(!!a11y[k])); });
    });
    panel.querySelector("#a11yreset").addEventListener("click", function () { a11y = JSON.parse(JSON.stringify(A11Y_DEFAULT)); applyA11y(); saveA11y(); draw(); });
  }
  draw();
  var tPanel = document.getElementById("themepanel"), tBtn = document.getElementById("themebtn");
  function close() { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  btn.addEventListener("click", function (e) {
    e.stopPropagation(); var open = panel.hidden; panel.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    if (open) { tPanel.hidden = true; tBtn.setAttribute("aria-expanded", "false"); }
  });
  tBtn.addEventListener("click", function () { close(); });
  panel.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !panel.hidden) { close(); btn.focus(); } });
}
(function () {
  try { var saved = JSON.parse(localStorage.getItem("pp-a11y") || "null"); if (saved) for (var k in A11Y_DEFAULT) if (saved[k] !== undefined) a11y[k] = saved[k]; } catch (e) {}
  if (!(a11y.size >= 0 && a11y.size < SIZES.length)) a11y.size = 0;
  applyA11y();
  buildA11yPanel();
})();
(function () {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("pp-theme") || "null"); } catch (e) {}
  setTheme(saved && saved.id ? saved : { id: "default" }, false);
  var t = themeById(currentTheme.id);
  if (t && t.more) document.getElementById("morefoods").click();
})();

route();
</script>
</body>
</html>
